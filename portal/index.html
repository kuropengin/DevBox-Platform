<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevBox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    .header-icon {
      width: 32px; height: 32px;
      background: #1f6feb;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    .header h1 { font-size: 1.1rem; font-weight: 600; color: #f0f6fc; }
    .header .username { font-size: 0.8rem; color: #8b949e; margin-top: 1px; }

    .divider { border: none; border-top: 1px solid #30363d; margin: 1.25rem 0; }

    .links { display: flex; flex-direction: column; gap: 0.75rem; }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      text-decoration: none;
      color: #c9d1d9;
      font-size: 0.9rem;
      transition: background 0.12s, border-color 0.12s;
      cursor: pointer;
    }

    .link-btn:hover { background: #2d333b; border-color: #484f58; }

    .link-btn .icon  { font-size: 1.2rem; flex-shrink: 0; }
    .link-btn .text  { flex: 1; }
    .link-btn .label { font-weight: 500; color: #f0f6fc; display: block; }
    .link-btn .desc  { font-size: 0.75rem; color: #8b949e; margin-top: 1px; }
    .link-btn .arrow { color: #484f58; font-size: 0.9rem; }

    .error { text-align: center; color: #f85149; font-size: 0.9rem; }

    .logout-link {
      display: block;
      text-align: center;
      color: #8b949e;
      font-size: 0.8rem;
      text-decoration: none;
    }
    .logout-link:hover { color: #f85149; text-decoration: underline; }
  </style>
</head>
<body>
  <div id="content" class="card" style="display:none">
    <div class="header">
      <div class="header-icon">⬡</div>
      <div>
        <h1>DevBox</h1>
        <div class="username" id="username-label"></div>
      </div>
    </div>
    <hr class="divider" />
    <div class="links">
      <a class="link-btn" id="vscode-link" target="_blank" rel="noopener">
        <span class="icon">💻</span>
        <span class="text">
          <span class="label">VS Code</span>
          <span class="desc">ブラウザで使えるコードエディタ</span>
        </span>
        <span class="arrow">↗</span>
      </a>
      <a class="link-btn" id="gui-link" target="_blank" rel="noopener">
        <span class="icon">🖥️</span>
        <span class="text">
          <span class="label">GUI デスクトップ</span>
          <span class="desc">Xpra HTML5 Linux デスクトップ</span>
        </span>
        <span class="arrow">↗</span>
      </a>
      <a class="link-btn" id="webapp-link" target="_blank" rel="noopener">
        <span class="icon">🌐</span>
        <span class="text">
          <span class="label">公開 Web アプリ</span>
          <span class="desc">Tomcat等、自分で起動したアプリ（認証なし）</span>
        </span>
        <span class="arrow">↗</span>
      </a>
    </div>
    <hr class="divider" />
    <div class="links">
      <a class="link-btn" id="password-link" href="/_auth/" target="_blank" rel="noopener">
        <span class="icon">🔑</span>
        <span class="text">
          <span class="label">パスワード変更</span>
          <span class="desc">ログインパスワードを変更する</span>
        </span>
        <span class="arrow">↗</span>
      </a>
    </div>
    <hr class="divider" />
    <a class="logout-link" href="/_auth/?logout=1">ログアウト</a>
  </div>

  <div id="error" class="error" style="display:none">
    ユーザーが見つかりません。管理者に連絡してください。
  </div>

  <script>
    // URL パスの第1セグメントをユーザー名として取得
    // 例: /yamada/ → yamada
    const username = location.pathname.split('/').filter(Boolean)[0];

    if (!username) {
      document.getElementById('error').style.display = 'block';
    } else {
      const base = '/' + username;
      document.getElementById('username-label').textContent = username;

      // 初回アクセス時だけ ~/workspace を自動で開く（2回目以降は素の
      // vscode/ にして、ユーザーが開いていた別フォルダを維持できるように
      // する）。下の二重アンダースコア囲みの文字列は install-front.sh が
      // インストール時に置換するプレースホルダー（backendのUSER_HOME_BASEと
      // 合わせること。詳細はREADMEの「ユーザーディレクトリの配置先」参照）。
      const userHomeBase = '__USER_HOME_BASE__';
      let vscodeHref = base + '/vscode/';
      const workspaceOpenedKey = 'devbox-workspace-opened-' + username;
      if (!localStorage.getItem(workspaceOpenedKey)) {
        vscodeHref += '?folder=' + encodeURIComponent(userHomeBase + '/' + username + '/workspace');
        localStorage.setItem(workspaceOpenedKey, '1');
      }
      document.getElementById('vscode-link').href = vscodeHref;

      document.getElementById('gui-link').href    = base + '/gui/';
      document.getElementById('webapp-link').href = base + '/webapp/';
      document.getElementById('content').style.display = 'block';
    }
  </script>
</body>
</html>
